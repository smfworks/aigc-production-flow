[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-studio"
version = "0.12.0"
description = "Phase 12 studio: Create wizard, Hermes handoff, agent-run status, and stitch. Comfy lanes stay opt-in."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "SMF Works" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "respx>=0.21.0",
  "PyJWT[crypto]>=2.9.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
]
s3 = [
  "boto3>=1.35.0",
]
celery = [
  "celery[redis]>=5.4.0",
]
oidc = [
  "PyJWT[crypto]>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
