# API-only (legacy). Prefer: docker compose -f docker-compose.studio.yml up --build
services:
  studio-api:
    build:
      context: ./studio
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      STUDIO_DATABASE_URL: sqlite:////data/studio.db
      STUDIO_MEDIA_ROOT: /data/media
      # Container DNS needs a non-loopback listen. The host port stays on 127.0.0.1.
      STUDIO_BIND_HOST: 0.0.0.0
      STUDIO_ALLOW_NON_LOOPBACK: "1"
      STUDIO_API_TOKEN: "${STUDIO_API_TOKEN:?Set STUDIO_API_TOKEN to a secret you choose}"
      STUDIO_PACK_BUILDER_URL: http://localhost:5173
    volumes:
      - studio-data:/data

volumes:
  studio-data:
