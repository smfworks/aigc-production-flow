name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  studio:
    name: studio pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install studio (dev extra)
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: pytest
        run: python -m pytest

  pack-builder:
    name: pack-builder npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  studio-web:
    name: studio-web typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio-web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    name: studio-web playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install studio API
        working-directory: studio
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio-web/package-lock.json
      - name: Install studio-web
        working-directory: studio-web
        run: npm ci
      - name: Install Chromium
        working-directory: studio-web
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        working-directory: studio-web
        run: npm run e2e
