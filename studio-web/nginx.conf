# Any Host other than loopback closes the connection. A page that reaches
# this port with a different Host does not get the SPA or the API proxy.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name 127.0.0.1 localhost [::1];
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location /api/ {
        proxy_pass http://studio-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Bearer is written at start into a file outside the document root.
        # The client Authorization header is not copied.
        include /etc/nginx/snippets/studio-auth.conf;
        # The shipped proxy does not authenticate humans. Clear identity
        # headers so a client cannot choose who they are. A forward-header
        # deployment overwrites X-Forwarded-User in its own proxy.
        proxy_set_header X-User-Name "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Org-Id $http_x_org_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://studio-api:8000/health;
        proxy_set_header Host $host;
    }

    location /healthz {
        proxy_pass http://studio-api:8000/healthz;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://studio-api:8000/readyz;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://studio-api:8000/metrics;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://studio-api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://studio-api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
