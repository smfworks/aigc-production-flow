server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    location /api/ {
        proxy_pass http://studio-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        # Local mode uses X-User-Name as a display name behind the bearer token.
        proxy_set_header X-User-Name $http_x_user_name;
        # The shipped proxy does not authenticate humans. Clear X-Forwarded-User
        # so a client cannot choose an identity. A forward-header deployment
        # overwrites that header in its own proxy. See docs/AUTH.md.
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Org-Id $http_x_org_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://studio-api:8000/health;
    }

    location /healthz {
        proxy_pass http://studio-api:8000/healthz;
    }

    location /readyz {
        proxy_pass http://studio-api:8000/readyz;
    }

    location /metrics {
        proxy_pass http://studio-api:8000/metrics;
    }

    location /docs {
        proxy_pass http://studio-api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://studio-api:8000/openapi.json;
    }

    location / {
        try_files $uri /index.html;
    }
}
